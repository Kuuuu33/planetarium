<!DOCTYPE html>
<html lang="ja">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="プラネタリウム">
<meta name="theme-color" content="#02030a">
<title>プラネタリウム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: manipulation;            /* ダブルタップ拡大を無効化 */
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;             /* 引っ張って更新を防ぐ */
  }
  #sky { display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: none; }
  body.ui-visible #sky { cursor: default; }

  /* コントロールパネル */
  #panel {
    position: fixed; z-index: 10;
    top: calc(16px + env(safe-area-inset-top));
    left: calc(16px + env(safe-area-inset-left));
    max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: rgba(8, 12, 28, 0.82);
    border: 1px solid rgba(120, 150, 220, 0.35);
    border-radius: 14px;
    padding: 16px 18px;
    color: #cdd8ff;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 13px;
    width: 268px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: opacity 0.4s ease, transform 0.4s ease;
    user-select: none;
  }
  body:not(.ui-visible) #panel { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  #panel h1 { font-size: 15px; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.05em; color: #eaf0ff; }
  #panel h1 span { font-size: 11px; opacity: 0.6; font-weight: 400; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 9px 0; gap: 8px; }
  .row label { flex: 0 0 auto; opacity: 0.85; }
  .row .val { font-variant-numeric: tabular-nums; opacity: 0.7; min-width: 54px; text-align: right; }
  input[type=range] { flex: 1; accent-color: #8ea8ff; height: 4px; }
  select, input[type=number] {
    background: rgba(20,28,52,0.9); color: #cdd8ff;
    border: 1px solid rgba(120,150,220,0.3); border-radius: 6px;
    padding: 4px 6px; font-size: 12px; font-family: inherit;
  }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .toggle {
    flex: 1 1 44%; text-align: center; padding: 6px 4px; border-radius: 8px;
    border: 1px solid rgba(120,150,220,0.3); cursor: pointer;
    transition: all 0.2s; font-size: 12px; background: rgba(20,28,52,0.5);
  }
  .toggle.on { background: rgba(110,140,240,0.35); border-color: rgba(150,180,255,0.7); color: #fff; }
  #fsBtn { width: 100%; margin-top: 12px; padding: 9px; border-radius: 9px; cursor: pointer;
    background: linear-gradient(135deg,#4a63c8,#6d4ac8); color:#fff; border:none; font-size:13px; font-family:inherit; font-weight:600; }
  #fsBtn:hover { filter: brightness(1.12); }
  .hint { margin-top: 11px; font-size: 11px; opacity: 0.5; line-height: 1.5; }
  hr { border: none; border-top: 1px solid rgba(120,150,220,0.2); margin: 12px 0; }

  #clock {
    position: fixed; z-index: 5;
    bottom: calc(18px + env(safe-area-inset-bottom));
    right: calc(22px + env(safe-area-inset-right));
    color: rgba(200,215,255,0.55); font-family: -apple-system, sans-serif;
    font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
    transition: opacity 0.4s; text-align: right; line-height: 1.5;
    pointer-events: none;
  }
  body:not(.ui-visible) #clock { opacity: 0.25; }

  /* 一時メッセージ */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(44px + env(safe-area-inset-bottom)); z-index: 20;
    background: rgba(8,12,28,0.92); color: #cdd8ff;
    border: 1px solid rgba(120,150,220,0.35); border-radius: 10px;
    padding: 12px 18px; font-size: 13px; line-height: 1.6;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    max-width: min(90vw, 340px); text-align: center;
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
    backdrop-filter: blur(10px);
  }
  #toast.show { opacity: 1; }

  /* ===== スマホ・小さい画面 ===== */
  @media (max-width: 600px) {
    #panel {
      width: calc(100vw - 24px); max-width: 320px;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      padding: 12px 14px; font-size: 13px;
      /* 画面を覆い尽くさないよう高さを制限（超えた分はスクロール） */
      max-height: min(68dvh, calc(100dvh - 24px - env(safe-area-inset-top)));
    }
    #panel h1 { font-size: 14px; margin-bottom: 10px; }
    .row { margin: 8px 0; }
    hr { margin: 10px 0; }
    /* タップ領域は確保しつつ詰める */
    .toggle { padding: 9px 4px; font-size: 12.5px; }
    #fsBtn { padding: 11px; font-size: 13px; margin-top: 10px; }
    select, input[type=number] { padding: 6px 8px; font-size: 13px; }
    input[type=range] { height: 20px; }
    .hint { font-size: 10.5px; margin-top: 8px; }
    #clock { font-size: 12px; right: calc(14px + env(safe-area-inset-right)); }
  }
  /* 横向きで画面が低いとき：パネルを詰める */
  @media (max-height: 460px) {
    #panel { padding: 10px 12px; font-size: 12px; }
    #panel h1 { margin-bottom: 8px; font-size: 13px; }
    .row { margin: 6px 0; }
    hr { margin: 8px 0; }
    .toggle { padding: 7px 4px; }
  }
</style>
</head>
<body class="ui-visible">
<canvas id="sky"></canvas>

<div id="panel">
  <h1>プラネタリウム <span>PLANETARIUM</span></h1>

  <div class="row">
    <label>場所</label>
    <select id="location"></select>
  </div>
  <div class="row">
    <label>緯度</label>
    <input type="number" id="lat" step="0.5" style="width:70px"> <span style="opacity:.5">°N</span>
  </div>
  <div class="row">
    <label>経度</label>
    <input type="number" id="lon" step="0.5" style="width:70px"> <span style="opacity:.5">°E</span>
  </div>

  <hr>

  <div class="row">
    <label>時間の速さ</label>
    <span class="val" id="speedVal">停止</span>
  </div>
  <input type="range" id="speed" min="0" max="8" step="1" value="0" style="width:100%">
  <div class="row" style="margin-top:4px">
    <label>星の明るさ</label>
    <span class="val" id="brightVal">100%</span>
  </div>
  <input type="range" id="bright" min="40" max="180" step="5" value="100" style="width:100%">

  <hr>

  <div class="row">
    <label>🎵 ヒーリング音楽</label>
    <span class="val" id="musicState">オフ</span>
  </div>
  <div class="toggles" style="margin-bottom:2px">
    <div class="toggle" id="musicToggle" style="flex:1 1 100%">♪ 音楽を再生</div>
  </div>
  <div class="row" style="margin-top:6px">
    <label>音量</label>
    <span class="val" id="volVal">55%</span>
  </div>
  <input type="range" id="volume" min="0" max="100" step="5" value="55" style="width:100%">

  <hr>

  <div class="toggles">
    <div class="toggle on" data-t="starnames">星の名前</div>
    <div class="toggle on" data-t="lines">星座線</div>
    <div class="toggle on" data-t="names">星座名</div>
    <div class="toggle on" data-t="milkyway">天の川</div>
    <div class="toggle on" data-t="meteors">流れ星</div>
    <div class="toggle" data-t="cardinal">方角</div>
    <div class="toggle" data-t="ground">地平線</div>
  </div>

  <div class="hint">Hキー: パネル表示/非表示 ・ Fキー: 全画面<br>マウスを止めると自動で隠れます</div>
</div>

<div id="clock"></div>
<div id="toast"></div>

// ============================================================
//  天文計算
// ============================================================
const D2R = Math.PI/180, R2D = 180/Math.PI, H2R = Math.PI/12;

// グリニッジ平均恒星時（度）
function gmst(date){
  const jd = date.getTime()/86400000 + 2440587.5;
  const T = (jd - 2451545.0)/36525.0;
  let g = 280.46061837 + 360.98564736629*(jd-2451545.0)
          + 0.000387933*T*T - T*T*T/38710000.0;
  g = g % 360; if(g<0) g+=360;
  return g;
}
// 地方恒星時（時）
function lstHours(date, lonDeg){
  let lst = (gmst(date) + lonDeg)/15.0;
  lst = lst % 24; if(lst<0) lst+=24;
  return lst;
}

// 赤道座標→地平座標。戻り値 {alt, az}（度）
function eqToHorizon(raH, decDeg, latDeg, lstH){
  const ha = (lstH - raH)*H2R;          // 時角(rad)
  const dec = decDeg*D2R, lat = latDeg*D2R;
  const sinAlt = Math.sin(dec)*Math.sin(lat) + Math.cos(dec)*Math.cos(lat)*Math.cos(ha);
  const alt = Math.asin(Math.max(-1,Math.min(1,sinAlt)));
  const cosAz = (Math.sin(dec) - Math.sin(alt)*Math.sin(lat)) / (Math.cos(alt)*Math.cos(lat) || 1e-9);
  let az = Math.acos(Math.max(-1,Math.min(1,cosAz)));
  if(Math.sin(ha) > 0) az = 2*Math.PI - az;   // 東側の補正
  return {alt: alt*R2D, az: az*R2D};
}

// 地平座標→画面座標（天頂中心の魚眼＝等距離射影）。
// 見上げた天球なので東西を反転（天井投影・肉眼と同じ向き）。
function project(altDeg, azDeg){
  if(altDeg < -2) return null;
  const z = (90 - altDeg)/90;             // 天頂=0, 地平=1
  const r = radius * z;
  const a = azDeg*D2R;
  // 北を上(-y)、東を左向きにして見上げた空を表現
  const x = cx - r*Math.sin(a);
  const y = cy - r*Math.cos(a);
  return {x, y, r};
}

const meteors = [];
function spawnMeteor(){
  const ang = (Math.random()*0.5 - 0.25) + (Math.random()<0.5?Math.PI*0.75:Math.PI*0.25);
  const edge = Math.random()*Math.PI*2;
  const sx = cx + Math.cos(edge)*radius*0.9;
  const sy = cy + Math.sin(edge)*radius*0.9 - radius*0.3;
  const dir = Math.atan2(cy-sy, cx-sx) + (Math.random()-0.5)*1.4;
  const speed = 9 + Math.random()*10;
  meteors.push({
    x:sx, y:sy, vx:Math.cos(dir)*speed, vy:Math.sin(dir)*speed,
    life:0, maxLife: 40+Math.random()*40, len: 60+Math.random()*90,

  });
}

// ============================================================

// ============================================================
function starColor(mag){
  // 明るい星は白〜青白、暗めは少し暖色に（簡易）
  if(mag < 0.5) return "#dfe8ff";
  if(mag < 1.5) return "#eef2ff";
  if(mag < 2.5) return "#ffffff";
  return "#f3f0ea";
}
function magToRadius(mag){
  const r = 3.2 - mag*0.62;
  return Math.max(0.5, r);
}

function drawBackground(){
  // 夜空のグラデ（天頂は濃紺、地平付近はわずかに明るく）
  const g = ctx.createRadialGradient(cx,cy,radius*0.1, cx,cy,radius*1.05);
  g.addColorStop(0, "#05060f");
  g.addColorStop(0.7, "#070a18");
  g.addColorStop(1, "#0c1024");
  ctx.fillStyle = "#02030a";
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawMilkyway(lstH){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.clip();
  ctx.lineCap = "round";
  MILKYWAY.forEach((band, bi)=>{
    // 帯を太い半透明ラインで
    for(let pass=0; pass<3; pass++){
      const width = (bi===0? 70:46) - pass*16;
      const alpha = (bi===0? 0.055:0.04) + pass*0.02;
      ctx.strokeStyle = `rgba(180,195,255,${alpha})`;
      ctx.lineWidth = Math.max(6, width);
      ctx.beginPath();
      let started=false;
      band.forEach(p=>{
        const h = eqToHorizon(p[0], p[1], state.lat, lstH);
        const pt = project(h.alt, h.az);
        if(pt){ if(!started){ctx.moveTo(pt.x,pt.y);started=true;} else ctx.lineTo(pt.x,pt.y); }
        else started=false;
      });
      ctx.stroke();
    }
  });
  ctx.restore();
}

function drawDust(lstH, tsec){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.clip();
  for(const d of dust){
    const h = eqToHorizon(d.ra, d.dec, state.lat, lstH);
    if(h.alt < 0) continue;
    const pt = project(h.alt, h.az);
    if(!pt) continue;
    const tw = 0.5 + 0.5*Math.sin(tsec*d.tws + d.tw);
    const a = (0.5 - (d.mag-4.5)*0.18) * tw * state.bright;
    if(a<=0.02) continue;
    ctx.fillStyle = `rgba(230,235,255,${Math.min(0.7,a)})`;
    ctx.fillRect(pt.x, pt.y, 1.1, 1.1);
  }
  ctx.restore();
}

function drawConstellationLines(lstH){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.clip();
  ctx.strokeStyle = "rgba(120,160,255,0.32)";
  ctx.lineWidth = 1;
  for(const c of CONSTELLATIONS){
    for(const seg of c.lines){
      const a = STARS[IDX[seg[0]]], b = STARS[IDX[seg[1]]];
      if(!a||!b) continue;
      const ha = eqToHorizon(a.ra,a.dec,state.lat,lstH);
      const hb = eqToHorizon(b.ra,b.dec,state.lat,lstH);
      if(ha.alt < 0 && hb.alt < 0) continue;
      const pa = project(ha.alt, ha.az), pb = project(hb.alt, hb.az);
      if(!pa||!pb) continue;
      ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawConstellationNames(lstH){
  ctx.save();
  // ラベルが円の縁で切れないよう、少し広めにクリップ
  ctx.beginPath(); ctx.arc(cx,cy,radius+34,0,Math.PI*2); ctx.clip();
  ctx.font = Math.round(12*LBL) + "px -apple-system, 'Hiragino Sans', sans-serif";
  ctx.fillStyle = "rgba(150,180,255,0.55)";
  ctx.textAlign = "center";
  for(const l of CONST_LABELS){
    const s = STARS[IDX[l.k]]; if(!s) continue;
    const h = eqToHorizon(s.ra,s.dec,state.lat,lstH);
    if(h.alt < 3) continue;
    const pt = project(h.alt,h.az); if(!pt) continue;
    ctx.fillText(l.t, pt.x, pt.y - 12);
  }
  ctx.restore();
}

function drawStars(lstH, tsec){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,radius+34,0,Math.PI*2); ctx.clip();
  ctx.textAlign = "left";
  ctx.font = Math.round(11*LBL) + "px -apple-system, 'Hiragino Sans', sans-serif";
  // 小さい画面では特に明るい星だけ名前を出して重なりを防ぐ
  const nameLimit = IS_SMALL ? 1.0 : 1.7;
  for(const s of STARS){
    const h = eqToHorizon(s.ra, s.dec, state.lat, lstH);
    if(h.alt < 0) continue;
    const pt = project(h.alt, h.az); if(!pt) continue;
    const tw = 0.75 + 0.25*Math.sin(tsec*s._tws + s._tw);
    let r = magToRadius(s.mag) * (0.5 + 0.5*state.bright);
    const col = starColor(s.mag);
    // グロー
    const glow = ctx.createRadialGradient(pt.x,pt.y,0, pt.x,pt.y, r*4.5);
    glow.addColorStop(0, `rgba(255,255,255,${0.5*tw*state.bright})`);
    glow.addColorStop(0.3, `rgba(200,215,255,${0.18*tw*state.bright})`);
    glow.addColorStop(1, "rgba(200,215,255,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(pt.x,pt.y, r*4.5, 0, Math.PI*2); ctx.fill();
    // コア
    ctx.fillStyle = col;
    ctx.globalAlpha = Math.min(1, tw*state.bright);
    ctx.beginPath(); ctx.arc(pt.x,pt.y, r, 0, Math.PI*2); ctx.fill();
    // 明るい星に十字の輝き
    if(s.mag < 1.2){
      ctx.strokeStyle = `rgba(255,255,255,${0.35*tw})`;
      ctx.lineWidth = 0.8;
      const sp = r*3.5;
      ctx.beginPath();
      ctx.moveTo(pt.x-sp,pt.y); ctx.lineTo(pt.x+sp,pt.y);
      ctx.moveTo(pt.x,pt.y-sp); ctx.lineTo(pt.x,pt.y+sp);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 固有名（1.6等より明るい星）
    if(state.show.starnames && s.name && s.mag < nameLimit){
      ctx.fillStyle = "rgba(255,240,200,0.7)";
      ctx.fillText(s.name, pt.x + r + 4, pt.y + 3);
    }
  }
  ctx.restore();
}

function drawMeteors(){
  ctx.save();
  ctx.lineCap = "round";
  for(const m of meteors){
    const t = m.life/m.maxLife;
    const alpha = Math.sin(Math.min(1,t*1.2)*Math.PI) * 0.9;
    const tailX = m.x - m.vx*(m.len/9);
    const tailY = m.y - m.vy*(m.len/9);
    const grad = ctx.createLinearGradient(m.x,m.y, tailX,tailY);
    grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
    grad.addColorStop(0.4, `rgba(190,210,255,${alpha*0.5})`);
    grad.addColorStop(1, "rgba(190,210,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = m.w;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tailX,tailY); ctx.stroke();
    // 先端の光点
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(m.x,m.y, m.w*0.9, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawHorizon(){
  // 地平線の円
  ctx.save();
  ctx.strokeStyle = "rgba(120,150,220,0.25)";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.stroke();
  if(state.show.ground){
    // 地平線の外側をうっすら地面色に
    ctx.beginPath();
    ctx.rect(0,0,W,H);
    ctx.arc(cx,cy,radius,0,Math.PI*2, true);
    ctx.fillStyle = "rgba(6,10,20,0.9)";
    ctx.fill("evenodd");
  }
  ctx.restore();
}

function drawCardinal(){
  ctx.save();
  ctx.font = "600 15px -apple-system, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const dirs = [["北",0],["東",90],["南",180],["西",270]];
  for(const [t,az] of dirs){
    const a = az*D2R;
    const x = cx - (radius+0)*Math.sin(a);
    const y = cy - (radius+0)*Math.cos(a);
    // 少し内側にラベル
    const lx = cx - (radius-18)*Math.sin(a);
    const ly = cy - (radius-18)*Math.cos(a);
    ctx.fillStyle = "rgba(160,190,255,0.75)";
    ctx.fillText(t, lx, ly);
  }
  ctx.restore();
}

let lastT = performance.now();
let meteorTimer = 0;

function frame(now){
  const dt = Math.min(100, now - lastT); lastT = now;
  const tsec = now/1000;

  // 時間を進める
  const mult = SPEEDS[state.speedIdx].mult;
  if(mult>0) state.simOffset += dt*mult;
  else if(mult===1) {} // 実時間は baseTime 側で追従
  // 実時間モードでも常に現在時刻に追従させたい場合
  if(state.speedIdx===1){ state.baseTime = Date.now() - state.simOffset; }

  const date = currentDate();
  const lstH = lstHours(date, state.lon);

  drawBackground();
  if(state.show.milkyway) drawMilkyway(lstH);
  drawDust(lstH, tsec);
  if(state.show.lines) drawConstellationLines(lstH);
  drawStars(lstH, tsec);
  if(state.show.names) drawConstellationNames(lstH);
  drawHorizon();
  if(state.show.cardinal) drawCardinal();

  // 流れ星
  if(state.show.meteors){
    meteorTimer -= dt;
    if(meteorTimer <= 0){
      spawnMeteor();
      meteorTimer = 1500 + Math.random()*4500;   // 1.5〜6秒ごと
    }
    for(let i=meteors.length-1;i>=0;i--){
      const m = meteors[i];
      m.x += m.vx*(dt/16); m.y += m.vy*(dt/16); m.life += dt/16;
      const dist = Math.hypot(m.x-cx, m.y-cy);
      if(m.life > m.maxLife || dist > radius*1.2) meteors.splice(i,1);
    }
    drawMeteors();
  }

  updateClock(date);
  requestAnimationFrame(frame);
}

// ============================================================
//  ヒーリング音楽（Web Audio APIで自動生成する無限アンビエント）
//  外部ファイル不要。静かなパッド＋やさしい鈴の音が流れ続ける。
// ============================================================
const Music = (function(){
  let ctx=null, master=null, reverb=null;
  let padGain=null, padNodes=[], chimeTimer=null, chordTimer=null;
  let playing=false, volume=0.55;

  // Cメジャー・ペンタトニック（癒やし系）: やわらかい音の粒に使う音域
  // 耳につく最高音域はカットして、中音域中心のまろやかな響きに
  const PENTA = [
    392.00, 440.00,                          // G4 A4
    523.25, 587.33, 659.25, 783.99, 880.00,  // C5 D5 E5 G5 A5
    1046.50, 1174.66                          // C6 D6（たまに高めのアクセント）
  ];
  // ゆっくり移り変わるパッドの和音（低音）
  const CHORDS = [
    [130.81, 196.00, 261.63, 329.63],  // Cadd (C3 G3 C4 E4)
    [146.83, 220.00, 293.66, 349.23],  // Dm7  (D3 A3 D4 F4)
    [164.81, 246.94, 329.63, 392.00],  // Em   (E3 B3 E4 G4)
    [174.61, 261.63, 349.23, 440.00]   // F    (F3 C4 F4 A4)
  ];
  let chordIdx = 0;

  function makeReverb(){
    const len = Math.floor(ctx.sampleRate * 3.4);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
    }
    const conv = ctx.createConvolver();
    conv.buffer = buf;
    return conv;
  }

  function init(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    reverb = makeReverb();
    const rvGain = ctx.createGain();
    rvGain.gain.value = 0.9;
    reverb.connect(rvGain).connect(master);
    Music._rv = reverb;
  }

  // やわらかい音の粒（遠くでふわっと響く）
  function playChime(){
    if(!playing) return;
    const now = ctx.currentTime;
    const freq = PENTA[Math.floor(Math.random()*PENTA.length)];

    // エンベロープ：ゆっくり立ち上げて長く余韻を残す（「ピン」ではなく「ふわ〜ん」）
    const voice = ctx.createGain();
    voice.gain.setValueAtTime(0.0001, now);
    voice.gain.linearRampToValueAtTime(0.09, now + 0.30);       // やわらかな立ち上がり
    voice.gain.exponentialRampToValueAtTime(0.0004, now + 6.5); // 長い余韻

    // ローパスで耳につく高音を丸める
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = Math.min(freq * 2.4, 2000);
    lp.Q.value = 0.3;

    // わずかにずらした2つのサイン波＋オクターブ下の芯で、丸く温かく
    const o1 = ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = freq; o1.detune.value = -4;
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq; o2.detune.value = +5;
    const o3 = ctx.createOscillator(); o3.type = "sine"; o3.frequency.value = freq / 2;
    const g3 = ctx.createGain(); g3.gain.value = 0.35;

    o1.connect(lp); o2.connect(lp); o3.connect(g3).connect(lp);
    lp.connect(voice);

    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    let out = voice;
    if(pan){ pan.pan.value = Math.random()*1.4 - 0.7; voice.connect(pan); out = pan; }

    // ドライは控えめ、残響はたっぷり → 遠くで響く質感
    const dry = ctx.createGain(); dry.gain.value = 0.5;
    out.connect(dry).connect(master);
    out.connect(reverb);

    [o1, o2, o3].forEach(o=>{ o.start(now); o.stop(now + 6.6); });

    // 次の一音を予約（4〜9秒後、ゆったり）
    chimeTimer = setTimeout(playChime, 4000 + Math.random()*5000);
  }

  // パッドの和音を鳴らす／差し替える
  function setChord(freqs, glideT){
    const now = ctx.currentTime;
    padNodes.forEach(n=>{
      try{ n.o.frequency.setTargetAtTime(0, now, 0.1); }catch(e){}
    });
    // 既存を止めて作り直す（クロスフェード）
    const oldNodes = padNodes; padNodes = [];
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 900;
    filter.Q.value = 0.4;
    filter.connect(padGain);
    freqs.forEach(f=>{
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.value = f;
      o.detune.value = Math.random()*8 - 4;
      const og = ctx.createGain();
      og.gain.value = 0;
      og.gain.setTargetAtTime(0.22, now, 1.6);
      // ゆっくりした揺らぎ
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.04 + Math.random()*0.07;
      const lfoG = ctx.createGain();
      lfoG.gain.value = 0.09;
      lfo.connect(lfoG).connect(og.gain);
      o.connect(og).connect(filter);
      o.start(); lfo.start();
      padNodes.push({o, og, lfo});
    });
    // 古い音をフェードアウトして停止
    oldNodes.forEach(n=>{
      try{
        n.og.gain.setTargetAtTime(0, now, 1.4);
        n.o.stop(now + 4); n.lfo.stop(now + 4);
      }catch(e){}
    });
  }

  function nextChord(){
    if(!playing) return;
    chordIdx = (chordIdx + 1) % CHORDS.length;
    setChord(CHORDS[chordIdx]);
    chordTimer = setTimeout(nextChord, 18000 + Math.random()*12000); // 18〜30秒ごと
  }

  function start(){
    padGain = ctx.createGain();
    padGain.gain.value = 0.9;
    padGain.connect(master);
    padGain.connect(reverb);
    playing = true;
    chordIdx = 0;
    setChord(CHORDS[0]);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(volume, ctx.currentTime, 2.0); // ふわっとフェードイン
    chimeTimer = setTimeout(playChime, 1500);
    chordTimer = setTimeout(nextChord, 20000);
  }

  function stop(){
    playing = false;
    clearTimeout(chimeTimer); clearTimeout(chordTimer);
    const now = ctx.currentTime;
    master.gain.setTargetAtTime(0, now, 1.2); // フェードアウト
    padNodes.forEach(n=>{
      try{ n.og.gain.setTargetAtTime(0, now, 1.0); n.o.stop(now+3); n.lfo.stop(now+3); }catch(e){}
    });
    padNodes = [];
  }

  return {
    async toggle(){
      if(!ctx) init();
      if(ctx.state === "suspended") await ctx.resume();
      if(!playing) start(); else stop();
      return playing;
    },
    setVolume(v){
      volume = v;
      if(master && playing) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.2);
    },
    isPlaying(){ return playing; }
  };
})();
window.Music = Music;

// ============================================================
//  UI
// ============================================================
const locSel = document.getElementById("location");
LOCATIONS.forEach((l,i)=>{
  const o = document.createElement("option");
  o.value = i; o.textContent = l.n; locSel.appendChild(o);
});
const latInp = document.getElementById("lat");
const lonInp = document.getElementById("lon");
latInp.value = state.lat; lonInp.value = state.lon;

locSel.addEventListener("change", ()=>{
  const l = LOCATIONS[+locSel.value];
  state.lat = l.lat; state.lon = l.lon;
  latInp.value = l.lat; lonInp.value = l.lon;
});
latInp.addEventListener("input", ()=>{ state.lat = clampNum(+latInp.value,-90,90); });
lonInp.addEventListener("input", ()=>{ state.lon = clampNum(+lonInp.value,-180,180); });
function clampNum(v,a,b){ if(isNaN(v)) return 0; return Math.max(a,Math.min(b,v)); }

const speedRange = document.getElementById("speed");
const speedVal = document.getElementById("speedVal");
speedRange.addEventListener("input", ()=>{
  state.speedIdx = +speedRange.value;
  speedVal.textContent = SPEEDS[state.speedIdx].label;
  if(state.speedIdx<=1){ state.baseTime = Date.now(); state.simOffset = 0; }
});

const brightRange = document.getElementById("bright");
const brightVal = document.getElementById("brightVal");
brightRange.addEventListener("input", ()=>{
  state.bright = +brightRange.value/100;
  brightVal.textContent = brightRange.value + "%";
});

// 音楽
const musicToggle = document.getElementById("musicToggle");
const musicState = document.getElementById("musicState");
const volume = document.getElementById("volume");
const volVal = document.getElementById("volVal");
musicToggle.addEventListener("click", async ()=>{
  const on = await Music.toggle();
  musicToggle.classList.toggle("on", on);
  musicToggle.textContent = on ? "♪ 再生中（停止）" : "♪ 音楽を再生";
  musicState.textContent = on ? "再生中" : "オフ";
});
Music.setVolume(+volume.value/100);
volume.addEventListener("input", ()=>{
  Music.setVolume(+volume.value/100);
  volVal.textContent = volume.value + "%";
});

document.querySelectorAll(".toggle[data-t]").forEach(el=>{
  el.addEventListener("click", ()=>{
    const t = el.dataset.t;
    state.show[t] = !state.show[t];
    el.classList.toggle("on", state.show[t]);
  });
});

const fsBtn = document.getElementById("fsBtn");
fsBtn.addEventListener("click", toggleFullscreen);
function toggleFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  const cur = document.fullscreenElement || document.webkitFullscreenElement;
  if(!req){
    // iOS Safari は全画面API非対応
    toast(IS_STANDALONE
      ? "すでに全画面で起動しています"
      : "iPhone / iPad では、共有ボタン →「ホーム画面に追加」から起動すると全画面になります");
    return;
  }
  try{
    if(!cur){ const p = req.call(el); if(p && p.catch) p.catch(()=>{}); }
    else if(exit){ exit.call(document); }
  }catch(e){ /* 失敗しても表示は継続 */ }
}

// 一時メッセージ
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 4500);
}

// 時計表示
const clockEl = document.getElementById("clock");
function updateClock(date){
  const w = ["日","月","火","水","木","金","土"][date.getDay()];
  const p2 = n=>String(n).padStart(2,"0");
  const dstr = `${date.getFullYear()}/${p2(date.getMonth()+1)}/${p2(date.getDate())}（${w}）`;
  const tstr = `${p2(date.getHours())}:${p2(date.getMinutes())}:${p2(date.getSeconds())}`;
  const loc = LOCATIONS[+locSel.value] ? LOCATIONS[+locSel.value].n : "";
  clockEl.innerHTML = `${dstr}<br><span style="font-size:18px">${tstr}</span>　${loc}`;
}

// パネル自動非表示
let hideTimer = null;
function showUI(){
  document.body.classList.add("ui-visible");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(()=>{ document.body.classList.remove("ui-visible"); }, 3500);
}
window.addEventListener("mousemove", showUI);
window.addEventListener("click", showUI);
window.addEventListener("touchstart", showUI, {passive:true});
showUI();

// スマホ向けの文言調整
if(IS_TOUCH){
  document.querySelector(".hint").innerHTML =
    IS_STANDALONE ? "画面をタップするとパネルが出ます"
                  : "画面をタップするとパネルが出ます<br>数秒で自動的に隠れます";
  if(!FS_SUPPORTED && !IS_STANDALONE){
    fsBtn.textContent = "📱 全画面にするには";
  } else if(IS_STANDALONE){
    fsBtn.style.display = "none";   // すでに全画面
  }
}

// キーボード
window.addEventListener("keydown", e=>{
  if(e.key==="h"||e.key==="H"){
    document.body.classList.toggle("ui-visible");
    if(document.body.classList.contains("ui-visible")) showUI();
  }
  if(e.key==="f"||e.key==="F"){ toggleFullscreen(); }
});

// スタート
requestAnimationFrame(frame);

})();
